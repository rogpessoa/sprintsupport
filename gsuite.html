<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gsuite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme:{
                extend:{
                    colors:{
                        azul:{
                            claro:'#C5DFFF',
                            escuro:'#051E3C',
                            hover:'#1057B8'
                        },
                    },
                    fontFamily:{
                        inter:['Inter', 'sans-serif']
                    },
                    keyframes:{
                        sino_kf:{
                            '0%, 100%':{
                                transform: 'rotate(-10deg)'
                            },
                            '50%':{
                                transform: 'rotate(10deg)'
                            }
                        }
                    },
                    animation:{
                        sino: 'sino_kf 0.31s ease-in-out infinite'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-azul-claro flex items-center justify-center min-h-screen p-4">
<main class="flex justify-center px-6">
    <section class="bg-azul-escuro lg:block w-1/6 rounded-l-lg">
        <img class="p-6 m-auto" src="img/logo.png" alt="logo do sprint">
    </section>

    <div class="bg-white p-8 rounded-lg shadow-md w-3/4">
        <section class="flex flex-col rounded-lg justify-center lg:rounded-l-lg">
            <img class="p-6 m-auto" src="img/gsuite.png" alt="logo do sprint">
        </section>
                <!-- NOME -->
            <form class="formulario" dados-formulario>
                <fieldset class="campo__formulario">
                    <label class="block text-sm font-medium text-gray-700" for="nome">Nome Completo:</label>
                    <input name="nome" id="nome" placeholder="Digite seu nome aqui..." class="mt-1 block w-full p-2 bg-gray-100 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring focus:ring-blue-300" required type="text" minlength="3">
                    <span class="mensagem-erro text-red-600"></span>
                </fieldset>
                <!-- MATRICULA -->
            <fieldset class="campo__formulario">
                <label class="block text-sm font-medium text-gray-700 mt-4" for="matricula">Matrícula:</label>
                <input id="matricula" name="matricula" placeholder="Digite sua matrícula aqui..." class="mt-1 block w-full p-2 border bg-gray-100 border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring focus:ring-blue-300" required type="text" minlength="10" maxlength="12">
                <span class="mensagem-erro text-red-600"></span>
            </fieldset>
                <!-- DESCRIÇÃO -->
            <FIELDSET class="campo__formulario">
                <label class="block text-sm font-medium text-gray-700 mt-4" for="descricao">Descrição:</label>
                <textarea id="descricao" placeholder="Descreva seu problema aqui..." name="descricao" rows="4" class="bg-gray-100 mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring focus:ring-blue-300" required></textarea>
                <span class="mensagem-erro text-red-600"></span>
            </FIELDSET>
                <!-- CATEGORIA -->
            <fieldset class="campo__formulario">
                <label class="block text-sm font-medium text-gray-700 mt-4" for="categoria">Categoria:</label>
                <select id="categoria" name="categoria" class="bg-gray-100 mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring focus:ring-blue-300" required>
                    <option value=" " disabled selected> </option>
                    <option value="login">Não consigo fazer login</option>
                    <option value="acesso">Mudar acesso</option>
                    <option value="outro">Outro - Especificar</option>
                </select>
            </fieldset>
                <!-- E-MAIL -->
            <fieldset class="campo__formulario">
                <label class="campo_etiqueta block text-sm font-medium text-gray-700 mt-4" for="email">Email:</label>
                <input id="email" name="email" placeholder="Digite seu e-mail aqui..." class="bg-gray-100 mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring focus:ring-blue-300" required type="email">
                <span class="mensagem-erro text-red-600"></span>
            </fieldset>
                <!-- NASCIMENTO -->
            <fieldset class="campo__formulario">
                <label class="block text-sm font-medium text-gray-700 mt-4" for="nascimento">Data Nascimento:</label>
                <input id="nascimento" name="nascimento" class="bg-gray-100 mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring focus:ring-blue-300" required type="date">
                <span class="mensagem-erro text-red-600"></span>
            </fieldset>

            <button class="mt-6 py-2 font-bold font-inter text-white bg-azul-escuro w-full py-2 rounded-full shadow-2xl" type="submit">Confirmar</button>
        </form>
    </div>
</main>
    <script src="./js/script.js" type="module"></script>
</body>
</html>
